<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpolación y Directivas</title>
    <link rel="stylesheet" href="../assets/vue.js.css">
  </head>
  <body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="app"></div>

    <script>
    const app = Vue.createApp({
      data() {
        return {
          img: "https://www.wearegecko.co.uk/media/50316/mountain-3.jpg",
          imgAlt: "Placeholder Image",
          inputUrl: "https://www.wearegecko.co.uk/media/50316/mountain-3.jpg",
          feedback: ""
        }
      },
      methods: {
        isValidImageUrl(value) {
          try {
            const url = new URL(value)
            return /\.(jpe?g|png|gif|bmp|webp|svg|avif)$/i.test(url.pathname)
          } catch (error) {
            return false
          }
        },
        changeImage() {
          if (this.isValidImageUrl(this.inputUrl)) {
            this.feedback = ""
            this.img = this.inputUrl
          } else {
            this.feedback = "Please enter a valid image URL."
          }
        }
      },
      template: `
        <div class="container">
          <div class="card card--form">
            <img v-bind:src="img" v-bind:alt="imgAlt" class="card-img">
            <div style="margin-top: 12px;">
              <input id="image-url" v-model="inputUrl" @input="changeImage" class="form-control" placeholder="Enter image URL" aria-label="URL de la imagen">
              <p class="error-message">{{ feedback }}</p>
            </div>
          </div>
        </div>
      `
    })
    app.mount("#app")
    </script>
  </body>
</html>
