<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpolación y Directivas</title>
  </head>
  <body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="app"></div>

    <script>
    const app = Vue.createApp({
      data() {
        return {
          img: "https://www.wearegecko.co.uk/media/50316/mountain-3.jpg",
          imgAlt: "Placeholder Image",
          inputUrl: "https://www.wearegecko.co.uk/media/50316/mountain-3.jpg",
          feedback: ""
        }
      },
      methods: {
        isValidImageUrl(value) {
          try {
            const url = new URL(value)
            return /\.(jpe?g|png|gif|bmp|webp|svg|avif)$/i.test(url.pathname)
          } catch (error) {
            return false
          }
        },
        changeImage() {
          if (this.isValidImageUrl(this.inputUrl)) {
            this.feedback = ""
            this.img = this.inputUrl
          } else {
            this.feedback = "Please enter a valid image URL."
          }
        }
      },
      template: `
        <div>
          <img v-bind:src="img" v-bind:alt="imgAlt" class="card-img">
          <div>
            <input v-model="inputUrl" @input="changeImage" class="form-control" placeholder="Enter image URL">
            <p class="error-message">{{ feedback }}</p>
          </div>
        </div>
      `
    })
    app.mount("#app")
    </script>
  </body>
</html>

<style>
  .form-control {
    width: 100%;
    padding: 8px;
    margin-top: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
  }
  .error-message {
    color: red;
    margin-top: 8px;
  }
  .card-img {
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    display: block;
    padding: 16px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
  
  #app {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f5;
  }
</style>
