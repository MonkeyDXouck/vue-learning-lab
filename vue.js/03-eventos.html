<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link rel="stylesheet" href="../assets/vue.js.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const app = Vue.createApp({
        data() {
          return {
            count: 0,
            isPressed: false
          };
        },
        methods: {
          handlePlusClick() {
            this.count++;
          },
          handleMinusClick() {
            this.count--;
            if (this.count < 0) {
              this.isPressed = true;
              this.count = 0;
              setTimeout(() => {
                this.isPressed = false;
              }, 300);
            }
          }
        },
        template: `
          <div class="container">
            <div class="card" :class="{ rotated: isPressed }">
              <h1 id="title">Contador</h1>
              <div class="content counter--card">
                <p>{{ count }}</p>
                <button type="button" class="button-icon" aria-label="Incrementar contador" @click="handlePlusClick">
                  <i class="fa-solid fa-plus" aria-hidden="true"></i>
                </button>
                <button type="button" class="button-icon" aria-label="Decrementar contador" @click="handleMinusClick">
                  <i class="fa-solid fa-minus" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        `
      }).mount('#app');
    </script>
  </body>
</html>
